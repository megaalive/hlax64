name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: hla64-linux-x64.tar.gz
            lab_archive: assembly-lab-linux-x64.tar.gz
          - os: windows-latest
            rid: win-x64
            archive: hla64-win-x64.zip
            lab_archive: assembly-lab-win-x64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish CLI
        run: dotnet publish src/HlaX64.Cli/HlaX64.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o publish/${{ matrix.rid }}

      - name: Publish MCP server
        run: dotnet publish src/HlaX64.McpServer/HlaX64.McpServer.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o publish/${{ matrix.rid }}/mcp

      - name: Publish Assembly Lab
        run: dotnet publish src/HlaX64.AssemblyLab/HlaX64.AssemblyLab.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o publish/${{ matrix.rid }}/assembly-lab

      - name: Bundle legal and readme
        shell: bash
        run: |
          cp LICENSE publish/${{ matrix.rid }}/
          cp README.md publish/${{ matrix.rid }}/

      - name: Generate dependency SBOM
        run: dotnet list src/HlaX64.Cli/HlaX64.Cli.csproj package --include-transitive --format json > sbom-deps.json

      - name: Pack Linux archive
        if: runner.os == 'Linux'
        run: |
          cd publish/linux-x64
          tar czf ../../${{ matrix.archive }} .
          cd ../..
          tar czf ${{ matrix.lab_archive }} -C publish/linux-x64/assembly-lab .
          sha256sum ${{ matrix.archive }} ${{ matrix.lab_archive }} > checksums.txt

      - name: Pack Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath ${{ matrix.archive }}
          Compress-Archive -Path publish/win-x64/assembly-lab/* -DestinationPath ${{ matrix.lab_archive }}
          $hashes = @(
            (Get-FileHash ${{ matrix.archive }} -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.archive }}",
            (Get-FileHash ${{ matrix.lab_archive }} -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.lab_archive }}"
          )
          $hashes | Out-File -Encoding utf8 checksums.txt

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive }}
            ${{ matrix.lab_archive }}
            checksums.txt
            sbom-deps.json
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false
