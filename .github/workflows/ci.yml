name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HLAX64_RUNTIME_DIR: ${{ github.workspace }}/src/HlaX64.Runtime

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install NASM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm gcc gdb

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y

      - name: Build
        run: dotnet build

      - name: Verify Linux runtime NASM
        if: runner.os == 'Linux'
        run: |
          sha256sum src/HlaX64.Runtime/linux-x64/sys.nasm
          nasm -v
          nasm -f elf64 -o /tmp/hlax64-sys-smoke.o src/HlaX64.Runtime/linux-x64/sys.nasm

      - name: Conformance manifests (NASM/IR snapshots)
        run: dotnet test tests/HlaX64.Compiler.Tests/HlaX64.Compiler.Tests.csproj --filter "FullyQualifiedName~ConformanceTests" --no-build

      - name: Publish Assembly Lab (smoke, Windows)
        if: runner.os == 'Windows'
        run: dotnet publish src/HlaX64.AssemblyLab/HlaX64.AssemblyLab.csproj -c Release -r win-x64 --self-contained false -o publish/assembly-lab-smoke

      - name: Publish Assembly Lab (smoke, Linux)
        if: runner.os == 'Linux'
        run: dotnet publish src/HlaX64.AssemblyLab/HlaX64.AssemblyLab.csproj -c Release -r linux-x64 --self-contained false -o publish/assembly-lab-smoke

      - name: Test (fast)
        run: dotnet test --filter "Category!=Integration" --no-build

      - name: Test (integration, serial)
        run: dotnet test --filter "Category=Integration" --no-build -- xUnit.parallelizeAssembly false

      - name: Doctor
        run: dotnet run --project src/HlaX64.Cli -- doctor

      - name: Verify stack and ABI (smoke)
        run: |
          dotnet run --project src/HlaX64.Cli -- verify-stack examples/curriculum/06-abi/stack-args-sysv.hla64
          dotnet run --project src/HlaX64.Cli -- verify-abi examples/curriculum/06-abi/stack-args-sysv.hla64 --json

      - name: CLI smoke (plan, diff, list-instructions)
        run: |
          dotnet run --project src/HlaX64.Cli -- plan examples/curriculum/00-getting-started/hello.hla64 --json
          dotnet run --project src/HlaX64.Cli -- diff examples/curriculum/00-getting-started/hello.hla64 examples/curriculum/00-getting-started/exitcode.hla64 --json
          dotnet run --project src/HlaX64.Cli -- list-instructions

      - name: Native integration test (Linux)
        if: runner.os == 'Linux'
        run: |
          dotnet run --project src/HlaX64.Cli -- test tests/samples/
          dotnet run --project src/HlaX64.Cli -- test tests/examples-curriculum/
          dotnet run --project src/HlaX64.Cli -- run examples/curriculum/00-getting-started/hello.hla64

      - name: Differential tests (Linux full run)
        if: runner.os == 'Linux'
        run: dotnet run --project src/HlaX64.Cli -- test-differential

      - name: Differential tests (Windows compile-only)
        if: runner.os == 'Windows'
        run: dotnet run --project src/HlaX64.Cli -- test-differential --compile-only

      - name: Windows MS ABI build smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet run --project src/HlaX64.Cli -- build examples/curriculum/00-getting-started/exitcode.hla64 --target windows-x64-msabi -o build/win-exitcode --json
          $proc = Start-Process -FilePath "build/win-exitcode/exitcode.exe" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 42) { throw "exitcode.exe returned $($proc.ExitCode), expected 42" }
          dotnet run --project src/HlaX64.Cli -- build tests/samples/export_lib/export_lib.hla64 --target windows-x64-msabi --output-kind shared-library -o build/win-lib --json
          if (-not (Test-Path "build/win-lib/libexport_lib.dll")) { throw "libexport_lib.dll not found under build/win-lib/" }
